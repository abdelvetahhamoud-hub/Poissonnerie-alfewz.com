<title>مسمكة الفوز</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f9fb;--card:#fff;--tx:#10303c;--mut:#5d7883;--pri:#0b7a9b;--pt:#fff;--bd:#d5e4ea;--ok:#1a8a4a;--bad:#c0392b;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a20;--card:#15262e;--tx:#e6f2f6;--mut:#8fb0bc;--pri:#3bb6d8;--pt:#06222c;--bd:#26414c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1a20;--card:#15262e;--tx:#e6f2f6;--mut:#8fb0bc;--pri:#3bb6d8;--pt:#06222c;--bd:#26414c;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.6}
header{padding:14px 16px;background:var(--pri);color:var(--pt);font-weight:700;font-size:20px}
nav{display:flex;gap:6px;padding:8px;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
nav button{flex:none}#lg button{padding:4px 8px;font-size:13px;margin-inline-start:4px}#lg button.on{background:var(--pt);color:var(--pri)}
main{padding:12px;max-width:760px;margin:auto}
button,input,select{font:inherit;color:var(--tx)}
button{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 14px;cursor:pointer}
button.p{background:var(--pri);color:var(--pt);border-color:var(--pri)}
button.on{background:var(--pri);color:var(--pt)}
button.d{color:var(--bad)}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);margin:4px 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.grid img{width:100%;height:110px;object-fit:cover;border-radius:10px;background:var(--bd)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.mut{color:var(--mut);font-size:14px}.price{font-weight:700;color:var(--pri)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.stars{font-size:22px;letter-spacing:2px}
#msg{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:12px;right:12px;background:var(--tx);color:var(--bg);padding:10px;border-radius:10px;text-align:center;display:none;z-index:9}
</style>

function tr(s){if(lang==="ar")return s;const i=lang==="fr"?1:2;for(const r of R){if(s.includes(r[0]))s=s.split(r[0]).join(r[i])}return s}
function applyLang(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  document.querySelectorAll("#lg button").forEach(b=>b.classList.toggle("on",b.dataset.l===lang));
  $("#hd").textContent="مسمكة الفوز";
  if(lang==="ar")return;
  for(const sel of ["#hd","#nav","#app","#wa"]){const root=$(sel);if(!root)continue;
    const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode())n.nodeValue=tr(n.nodeValue);
    root.querySelectorAll("[placeholder]").forEach(e=>e.placeholder=tr(e.placeholder))}
}
$("#lg").onclick=e=>{const l=e.target.dataset.l;if(l){lang=l;try{localStorage.setItem("lg",l)}catch(x){}render()}};

const isOwner=()=>!!(profile&&profile.role==="owner");
const imgUrl=p=>{if(!p)return"";const u=sb.storage.from("product-images").getPublicUrl(p).data.publicUrl;return u.startsWith(SUPABASE_URL+"/storage/v1/object/public/product-images/")?u:""};
async function realType(f){const b=new Uint8Array(await f.slice(0,12).arrayBuffer());return (b[0]===0xFF&&b[1]===0xD8)||(b[0]===0x89&&b[1]===0x50&&b[2]===0x4E&&b[3]===0x47)||(b[0]===0x52&&b[1]===0x49&&b[8]===0x57&&b[9]===0x45)}
async function shrink(f){const bmp=await createImageBitmap(f);let w=900;
  for(let q=.7;q>=.3;q-=.15){const r=Math.min(1,w/Math.max(bmp.width,bmp.height)),c=document.createElement("canvas");
    c.width=Math.round(bmp.width*r);c.height=Math.round(bmp.height*r);c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    const b=await new Promise(res=>c.toBlob(res,"image/jpeg",q));if(b&&b.size<250000)return b;w=Math.round(w*.8)}
  return null}
async function uploadImg(f){
  if(!/^image\/(jpeg|png|webp)$/.test(f.type)||f.size>8e6||!(await realType(f))){toast("صورة JPG/PNG حتى 3MB");return null}
  let b=null;try{b=await shrink(f)}catch(e){}
  if(!b){toast("تعذر قراءة الصورة، جرّب صورة أخرى");return null}
  const path=crypto.randomUUID()+".jpg";
  const {error}=await sb.storage.from("product-images").upload(path,b,{contentType:"image/jpeg"});
  if(error){toast("فشل رفع الصورة");return null}return path}

async function loadPublic(){
  const [p,s]=await Promise.all([sb.from("products").select("*").eq("active",true).order("created_at"),sb.from("settings").select("*").eq("id",1).maybeSingle()]);
  products=p.data||[];settings=s.data||{};}
async function loadMe(){
  if(!session){profile=null;return}
  const {data}=await sb.from("profiles").select("*").eq("id",session.user.id).maybeSingle();profile=data}
async function loadOwner(){
  if(!isOwner()){orders=[];gifts=[];return}
  const o=await sb.from("orders").select("*,order_items(name,price,qty)").order("created_at",{ascending:false}).limit(50);orders=o.data||[];
  const g=await sb.from("profiles").select("id,name,phone,stars").gte("stars",GOAL);gifts=g.data||[]}
sb.auth.onAuthStateChange((ev,s)=>{session=s;setTimeout(async()=>{await loadMe();await loadOwner();render()},0)});
loadPublic().then(render).catch(render);

function render(){
  const n=Object.values(cart).reduce((a,b)=>a+b,0);
  const tabs=[["shop","🛒 المتجر"],["cart","السلة ("+n+")"],["me","حسابي"]];
  if(isOwner())tabs.push(["admin","⚙️ لوحة المالك"]);
  $("#nav").innerHTML=tabs.map(([k,l])=>`<button class="${tab===k?"on":""}" data-t="${k}">${l}</button>`).join("");
  $("#nav").onclick=e=>{const t=e.target.dataset.t;if(t){tab=t;render()}};
  ({shop:shop,cart:cartView,me:meView,admin:adminView})[tab]();
  waFloat();applyLang();
}
function waNum(){const n=String(settings.whatsapp||"").replace(/\D/g,"").replace(/^222/,"");return okPhone(n)?n:""}
function waFloat(){
  let b=document.getElementById("wa");const n=waNum();
  if(!n){if(b)b.remove();return}
  if(!b){b=document.createElement("a");b.id="wa";b.target="_blank";b.rel="noopener";
    b.style.cssText="position:fixed;left:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));background:#25d366;color:#fff;padding:12px 18px;border-radius:30px;font-weight:700;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.3);z-index:8";document.body.appendChild(b)}
  b.textContent="💬 تواصل معنا على واتساب";
  b.href="https://wa.me/222"+n+"?text="+encodeURIComponent("السلام عليكم، أريد الاستفسار عن مسمكة الفوز");
}
function welcome(){
  if(welcomed)return "";const n=waNum();
  const nm=profile&&profile.name?" "+esc(profile.name):"";
  return `<div class="card" style="border-color:var(--pri)"><b>مرحباً بك${nm} في مسمكة الفوز 🐟</b><div class="mut">أسماك طازجة كل يوم. تواصل مع الوكيل مباشرة على واتساب لأي استفسار أو طلب.</div><div class="row" style="margin-top:8px">${n?`<a href="https://wa.me/222${n}?text=${encodeURIComponent("السلام عليكم، زرت موقع مسمكة الفوز وأريد الاستفسار")}" target="_blank" rel="noopener"><button class="p">💬 تحدث مع الوكيل</button></a>`:""}<button data-x="1">إغلاق</button></div></div>`}

function shop(){
  const list=products.filter(p=>!cat||p.category===cat);
  $("#app").innerHTML=welcome()+`<div class="chips"><button class="${cat?"":"on"}" data-c="">الكل</button>${TYPES.map(t=>`<button class="${cat===t?"on":""}" data-c="${esc(t)}">${esc(t)}</button>`).join("")}</div>
  <div class="grid">${list.map(p=>`<div class="card">${imgUrl(p.image_path)?`<img src="${esc(imgUrl(p.image_path))}" alt="">`:""}<div><b>${esc(p.name)}</b></div><div class="price">${money(p.price)}${p.unit?" / "+esc(p.unit):""}</div><button class="p" data-add="${esc(p.id)}" style="width:100%;margin-top:6px">أضف للسلة</button></div>`).join("")||'<div class="mut">لا توجد منتجات بعد.</div>'}</div>`;
  $("#app").onclick=e=>{const c=e.target.dataset.c,a=e.target.dataset.add;
    if(e.target.dataset.x){welcomed=true;render()}
    if(c!==undefined){cat=c;render()} if(a){cart[a]=Math.min(99,(cart[a]||0)+1);toast("أُضيف للسلة");render()}};
}
function total(){return Object.entries(cart).reduce((s,[id,q])=>{const p=products.find(x=>x.id===id);return s+(p?p.price*q:0)},0)}
function cartView(){
  const items=Object.entries(cart).map(([id,q])=>[products.find(x=>x.id===id),q]).filter(([p])=>p);
  $("#app").innerHTML=items.length?`${items.map(([p,q])=>`<div class="card row"><div>${esc(p.name)}<div class="mut">${money(p.price)}</div></div><div><button data-d="${esc(p.id)}">−</button> ${q} <button data-i="${esc(p.id)}">+</button></div></div>`).join("")}
  <div class="card"><div class="row"><b>المجموع</b><span class="price">${money(total())}</span></div>
  <label>طريقة الدفع</label><select id="pay">${PAYS.map(([k,l])=>`<option value="${k}">${l}</option>`).join("")}</select>
  <div id="payinfo" class="mut"></div>
  <input id="ref" placeholder="رقم عملية التحويل (للدفع بالتطبيق)" maxlength="30" hidden>
  <label id="rl" class="mut" hidden>صورة إشعار الدفع من التطبيق (إجباري)</label><input id="rcpt" type="file" accept="image/jpeg,image/png,image/webp" hidden>
  <button class="p" id="send" style="width:100%">إرسال الطلب</button></div>`:'<div class="card">السلة فارغة.</div>';
  if(!items.length)return;
  const upd=()=>{const app=$("#pay").value!=="cash";$("#ref").hidden=!app;$("#rcpt").hidden=!app;$("#rl").hidden=!app;
    const pn=String(settings.pay_number||"");
    $("#payinfo").textContent=app?(pn?"حوّل المبلغ إلى الرقم: "+pn+" ثم اكتب رقم العملية.":"اطلب رقم الحساب من المالك عبر واتساب."):"ادفع نقداً عند الاستلام."};
  $("#pay").onchange=upd;upd();applyLang();
  $("#app").onclick=e=>{const d=e.target.dataset.d,i=e.target.dataset.i;
    if(i){cart[i]=Math.min(99,cart[i]+1);render()} if(d){cart[d]--;if(cart[d]<=0)delete cart[d];render()}};
  $("#send").onclick=sendOrder;
}
async function sendOrder(){
  if(Date.now()-lastOrder<20000)return toast("انتظر قليلاً قبل إرسال طلب آخر");
  if(!session||!profile||!profile.name){tab="me";render();return toast("سجّل رقمك الموريتاني أولاً")}
  const pay=$("#pay").value,ref=$("#ref").value.trim();let path=null;
  const btn=$("#send");btn.disabled=true;
  try{
    if(pay!=="cash"){
      if(!/^[A-Za-z0-9]{4,30}$/.test(ref))return toast("أدخل رقم العملية");
      const f=$("#rcpt").files[0];if(!f)return toast("ارفع صورة إشعار الدفع");
      if(!/^image\/(jpeg|png|webp)$/.test(f.type)||!(await realType(f)))return toast("صورة JPG أو PNG فقط");
      let b=null;try{b=await shrink(f)}catch(e){}
      if(!b)return toast("تعذر قراءة الصورة، جرّب صورة أخرى");
      path=session.user.id+"/"+Date.now()+".jpg";
      const up=await sb.storage.from("receipts").upload(path,b,{contentType:"image/jpeg"});
      if(up.error)return toast("تعذر إرسال الطلب");
    }
    const items=Object.entries(cart).map(([product_id,qty])=>({product_id,qty:Math.min(99,qty)}));
    const {error}=await sb.rpc("create_order",{p_items:items,p_pay:pay,p_ref:pay==="cash"?null:ref,p_receipt:path});
    if(error)return toast(/dup_ref/.test(error.message)?"رقم العملية مستخدم من قبل":/too_fast/.test(error.message)?"انتظر قليلاً قبل إرسال طلب آخر":"تعذر إرسال الطلب");
    const lines=Object.entries(cart).map(([id,q])=>{const p=products.find(x=>x.id===id);return p?p.name+" × "+q:null}).filter(Boolean).join("%0A");
    const t=total();lastOrder=Date.now();cart={};render();toast("تم إرسال الطلب ✅");
    const n=waNum();if(n)window.open("https://wa.me/222"+n+"?text="+encodeURIComponent("طلب جديد من مسمكة الفوز")+"%0A"+lines+"%0A"+encodeURIComponent("المجموع: "+t+" أوقية"),"_blank","noopener");
  }catch(e){toast("تعذر إرسال الطلب")}finally{if(btn)btn.disabled=false}
}

function meView(){
  if(!session){
    $("#app").innerHTML=`<div class="card"><h3>تسجيل الدخول</h3><label>رقم الهاتف (+222)</label><input id="ph" inputmode="numeric" maxlength="8" placeholder="مثال: 22123456" value="${esc(otpFor||"")}" ${otpFor?"disabled":""}>${otpFor?'<label>رمز التحقق</label><input id="otp" inputmode="numeric" maxlength="6" autocomplete="one-time-code">':""}<button class="p" id="go">${otpFor?"تأكيد الرمز":"إرسال الرمز"}</button></div>`;
    $("#go").onclick=async()=>{
      if(!otpFor){const p=$("#ph").value.trim();if(!okPhone(p))return toast("رقم موريتاني غير صحيح (8 أرقام تبدأ بـ 2 أو 3 أو 4)");
        const {error}=await sb.auth.signInWithOtp({phone:"+222"+p,options:{shouldCreateUser:true}});
        if(error)return toast("تعذر إرسال الرمز");otpFor=p;render()}
      else{const t=$("#otp").value.trim();if(!/^\d{6}$/.test(t))return toast("رمز غير صحيح");
        const {error}=await sb.auth.verifyOtp({phone:"+222"+otpFor,token:t,type:"sms"});
        if(error)return toast("رمز غير صحيح");otpFor=null}};
    return}
  if(!profile){$("#app").innerHTML='<div class="card">جاري التحميل…</div>';return}
  const bar="⭐".repeat(Math.min(profile.stars,GOAL))+"☆".repeat(Math.max(0,GOAL-profile.stars));
  $("#app").innerHTML=`<div class="card"><h3>حسابي</h3>
  <label>الاسم</label><input id="nm" maxlength="40" value="${esc(profile.name||"")}">
  <label>رقم الهاتف (+222)</label><input value="${esc(profile.phone)}" disabled>
  <div class="row"><button class="p" id="sv">حفظ</button><button id="out">تسجيل الخروج</button></div></div>
  <div class="card"><b>نجومي</b><div class="stars">${bar}</div><div class="mut">كل 1000 أوقية مشتريات = نجمة. عند 10 نجوم تحصل على هدية 🎁${profile.stars>=GOAL?" — مبروك! اطلب هديتك من المالك":""}</div></div>`;
  $("#sv").onclick=async()=>{const n=$("#nm").value.trim();if(n.length<2||n.length>40)return toast("أدخل الاسم");
    const {error}=await sb.from("profiles").update({name:n}).eq("id",session.user.id);
    if(error)return toast("تعذر الحفظ");await loadMe();toast("تم الحفظ");render()};
  $("#out").onclick=()=>sb.auth.signOut();
}

function adminView(){
  if(!isOwner()){tab="shop";return render()}
  $("#app").innerHTML=`<div class="card"><h3>إضافة منتج</h3>
  <input id="pn" placeholder="اسم المنتج" maxlength="60">
  <select id="pc">${TYPES.map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join("")}</select>
  <input id="pp" placeholder="السعر بالأوقية" inputmode="numeric" maxlength="7">
  <input id="pu" placeholder="الوحدة (كغ، قطعة)" maxlength="12">
  <input id="pf" type="file" accept="image/jpeg,image/png,image/webp">
  <button class="p" id="add">إضافة</button></div>
  <div class="card"><h3>الإعدادات</h3>
  <input id="sw" placeholder="رقم واتساب المالك (8 أرقام)" inputmode="numeric" maxlength="8" value="${esc(settings.whatsapp||"")}">
  <input id="sp" placeholder="رقم الدفع (بنكيلي/مصرفي/سداد)" inputmode="numeric" maxlength="8" value="${esc(settings.pay_number||"")}">
  <button id="ss">حفظ</button></div>
  <div class="card"><h3>المنتجات</h3>${products.map(p=>`<div class="card" data-box="${esc(p.id)}"><div class="row"><b>${esc(p.name)}</b>${imgUrl(p.image_path)?`<img src="${esc(imgUrl(p.image_path))}" alt="" style="width:48px;height:48px;object-fit:cover;border-radius:8px">`:""}</div><label class="mut">السعر (أوقية)</label><input data-ep="${esc(p.id)}" inputmode="numeric" maxlength="7" value="${esc(p.price)}"><label class="mut">صورة المنتج</label><input type="file" data-ef="${esc(p.id)}" accept="image/jpeg,image/png,image/webp"><div class="row"><button class="p" data-sv="${esc(p.id)}">حفظ التعديل</button><button class="d" data-del="${esc(p.id)}">حذف</button></div></div>`).join("")||'<span class="mut">لا شيء</span>'}</div>
  <div class="card"><h3>صرف هدية</h3>${gifts.map(g=>`<div class="row"><span>${esc(g.name||"")} · ${esc(g.phone)} · ${esc(g.stars)} نجمة</span><button class="p" data-gf="${esc(g.id)}">تسليم الهدية</button></div>`).join("")||'<span class="mut">لا شيء</span>'}</div>
  <div class="card"><h3>الطلبات</h3>${orders.map(o=>`<div class="card"><div class="row"><b>${esc(o.name)} · ${esc(o.phone)}</b><span>${money(o.total)}</span></div>
  <div class="mut">${(o.order_items||[]).map(i=>esc(i.name)+"×"+esc(i.qty)).join("، ")}<br>${esc(PAYL[o.pay_method]||"")} ${esc(o.tx_ref||"")} — ${o.status==="new"?"جديد":"مؤكد"}</div>
  ${okPhone(String(o.phone))?`<a href="https://wa.me/222${esc(o.phone)}" target="_blank" rel="noopener"><button>واتساب الزبون</button></a>`:""}
  ${o.receipt_path?`<button data-rc="${esc(o.receipt_path)}">عرض الإشعار</button>`:""}
  ${o.status==="new"?`<button class="p" data-ok="${esc(o.id)}">تأكيد وإضافة نجوم</button>`:""}</div>`).join("")||'<span class="mut">لا طلبات</span>'}</div>`;
  $("#app").onclick=async e=>{const t=e.target,d=t.dataset;let changed=false;
    try{
      if(t.id==="ss"){const w=$("#sw").value.trim(),p=$("#sp").value.trim();
        if((w&&!okPhone(w))||(p&&!okPhone(p)))return toast("رقم غير صحيح");
        const {error}=await sb.from("settings").upsert({id:1,whatsapp:w||null,pay_number:p||null});if(error)throw error;toast("تم الحفظ");changed=true}
      else if(t.id==="add"){const name=$("#pn").value.trim(),price=Number($("#pp").value),f=$("#pf").files[0];
        if(!name||!Number.isInteger(price)||price<=0||price>10000000)return toast("تحقق من الاسم والسعر");
        let image_path=null;if(f){image_path=await uploadImg(f);if(!image_path)return}
        const {error}=await sb.from("products").insert({name,category:$("#pc").value,price,unit:$("#pu").value.trim()||"كغ",image_path});if(error)throw error;toast("تمت الإضافة");changed=true}
      else if(d.sv){const box=t.closest("[data-box]"),price=Number(box.querySelector("[data-ep]").value),f=box.querySelector("[data-ef]").files[0];
        if(!Number.isInteger(price)||price<=0||price>10000000)return toast("تحقق من السعر");
        const upd={price};if(f){const ip=await uploadImg(f);if(!ip)return;upd.image_path=ip}
        const {error}=await sb.from("products").update(upd).eq("id",d.sv);if(error)throw error;toast("تم حفظ التعديل ✅");changed=true}
      else if(d.del){if(!confirm(tr("حذف المنتج؟")))return;const {error}=await sb.from("products").delete().eq("id",d.del);if(error)throw error;changed=true}
      else if(d.ok){const {error}=await sb.rpc("confirm_order",{p_order:d.ok});if(error)throw error;toast("تم الحفظ");changed=true}
      else if(d.gf){const {error}=await sb.rpc("redeem_gift",{p_user:d.gf});if(error)throw error;toast("تم الحفظ");changed=true}
      else if(d.rc){const {data}=await sb.storage.from("receipts").createSignedUrl(d.rc,60);if(data&&data.signedUrl)window.open(data.signedUrl,"_blank","noopener")}
    }catch(err){toast("تعذر الحفظ")}
    if(changed){await loadPublic();await loadOwner();render()}};
}
</script>
